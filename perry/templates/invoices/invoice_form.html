{% extends "base.html" %}

{% block title %}New invoice · Perry CRM{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap mb-3">
    <div>
      <h1 class="h3 mb-1">New invoice</h1>
      <div class="text-muted">Create an invoice for a completed job</div>
    </div>
  </div>

  <div class="card">
    <div class="card-body">
      <form method="post" class="row g-3">
        {% csrf_token %}

        {% for field in form %}
          <div class="col-md-6">
            <label class="form-label" for="{{ field.id_for_label }}">{{ field.label }}</label>
            {{ field }}
            {% for error in field.errors %}
              <div class="text-danger small">{{ error }}</div>
            {% endfor %}
          </div>
        {% endfor %}

        <div class="col-12">
          <button class="btn btn-primary" type="submit">Create invoice</button>
          <a class="btn btn-outline-secondary" href="{% url 'invoice_list' %}">Cancel</a>
        </div>
      </form>
    </div>
  </div>
{% endblock %}
