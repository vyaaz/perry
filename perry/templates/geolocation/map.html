{% extends "base.html" %}

{% block title %}Map · Perry CRM{% endblock %}

{% block extra_head %}
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    #map { height: 70vh; }
  </style>
{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap mb-3">
    <div>
      <h1 class="h3 mb-1">Map</h1>
      <div class="text-muted">Use the Sales menu to log a house interaction.</div>
    </div>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <div id="map"></div>
    </div>
  </div>
{% endblock %}

{% block extra_js %}
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  {{ houses|json_script:"houses-data" }}
  <script>
    const map = L.map("map").setView([39.5, -98.35], 4); // US center default
    L.tileLayer("https://server.arcgisonline.com/ArcGIS/rest/services/World_Street_Map/MapServer/tile/{z}/{y}/{x}", {
      maxZoom: 19,
      attribution: "Tiles &copy; Esri &mdash; Source: Esri, DeLorme, NAVTEQ, USGS, Intermap, iPC, NRCAN, Esri Japan, METI, Esri China (Hong Kong), Esri (Thailand), TomTom",
    }).addTo(map);

    const housesData = JSON.parse(document.getElementById('houses-data').textContent);

    // Color mapping for house statuses
    const statusColors = {
      'SOLD': 'green',
      'NO_ANSWER': 'gray',
      'REJECTED': 'red',
      'NON_DM': 'blue',
      'COME_BACK': 'orange',
      'LEAD': 'yellow'
    };

    // Add markers for each house
    housesData.forEach(house => {
      const color = statusColors[house.status] || 'gray';
      const marker = L.circleMarker([house.latitude, house.longitude], {
        color: color,
        fillColor: color,
        fillOpacity: 0.8,
        radius: 8
      }).addTo(map);
      const editUrl = "{% url 'house_edit' 0 %}".replace("/0/", `/${house.id}/`);
      marker.bindPopup(
        `<b>${house.address}</b><br>${house.status_display}<br>` +
        `<div class="d-flex gap-2 mt-2">` +
          `<a class="btn btn-sm btn-primary" href="${editUrl}">Edit</a>` +
        `</div>`
      );
    });

    // Adjust map view to fit all markers if there are any
    if (housesData.length > 0) {
      const group = new L.featureGroup(housesData.map(h => L.marker([h.latitude, h.longitude])));
      map.fitBounds(group.getBounds().pad(0.1));
    }

    // Click-to-create removed (we log interactions via the Sales flow).
  </script>
{% endblock %}
