{% extends "base.html" %}

{% block title %}Map · Perry CRM{% endblock %}

{% block extra_head %}
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY="
    crossorigin=""
  />
  <style>
    #map { height: 70vh; }
  </style>
{% endblock %}

{% block content %}
  <div class="d-flex justify-content-between align-items-start gap-3 flex-wrap mb-3">
    <div>
      <h1 class="h3 mb-1">Map</h1>
      <div class="text-muted">House markers (read-only for now)</div>
    </div>
  </div>

  <div class="card">
    <div class="card-body p-0">
      <div id="map"></div>
    </div>
  </div>
{% endblock %}

{% block extra_js %}
  <script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
  ></script>
  {{ houses|json_script:"houses-data" }}
  <script>
    const map = L.map("map").setView([39.5, -98.35], 4); // US center default
    L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
      maxZoom: 19,
      attribution: "&copy; OpenStreetMap",
    }).addTo(map);

    // TODO: In next step, we’ll pass marker data, color by status, and add click-to-add.
  </script>
{% endblock %}
