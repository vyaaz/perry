{% extends "base.html" %}

{% block title %}Login · Perry CRM{% endblock %}

{% block content %}
  <div class="row justify-content-center">
    <div class="col-sm-10 col-md-6 col-lg-4">
      <div class="card shadow-sm">
        <div class="card-body">
          <h1 class="h4 mb-3">Sign in</h1>

          <form method="post" class="vstack gap-3">
            {% csrf_token %}
            <div>
              <label class="form-label" for="id_username">Username</label>
              <input class="form-control" type="text" name="username" id="id_username" required autofocus />
            </div>
            <div>
              <label class="form-label" for="id_password">Password</label>
              <input class="form-control" type="password" name="password" id="id_password" required />
            </div>
            <button class="btn btn-primary w-100" type="submit">Login</button>
          </form>
        </div>
      </div>
      <p class="text-muted small mt-3 mb-0">
        Don&rsquo;t have an account? <a href="{% url 'register' %}">Sign up here</a> to create an Employee or Manager account.
      </p>
    </div>
  </div>
{% endblock %}
